<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS UWP - Win10 Clean Style</title>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        :root {
            --bg-color: #004578;
            --sidebar-bg-collapsed: rgba(0, 0, 0, 0.45);
            --sidebar-bg-expanded: rgba(30, 30, 30, 0.85);
            --accent: #0078d7; 
            --accent-hover: #005a9e;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --font-family: 'Segoe UI', 'Microsoft YaHei', 'Arial', sans-serif;
            --sidebar-collapsed-width: 48px;
            --sidebar-expanded-width: 260px;
            --tile-size: 140px;
            --tile-gap: 12px;
            --win10-curve: cubic-bezier(0.1, 0.9, 0.2, 1); 
            --win10-entrance: cubic-bezier(0, 0, 0, 1);
            
            --reader-font-size: 18px;
            --reader-bg: #111111;
            --reader-text: #cccccc;
            --reader-title-color: #ffffff;
        }

        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        /* 全局滚动条美化 */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
        ::-webkit-scrollbar-track { background: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            overflow-x: hidden;
            min-height: 100vh;
            background-image: radial-gradient(circle at 90% 10%, rgba(255,255,255,0.08) 0%, transparent 40%),
                              linear-gradient(135deg, #005a9e 0%, #001832 100%);
            background-attachment: fixed;
            transition: background-image 0.5s ease-in-out; 
            background-size: cover;
            background-position: center;
        }

        body.locked { overflow: hidden !important; }

        /* Toast Notification */
        #toast-container {
            position: fixed; bottom: 20px; right: 20px; z-index: 10000;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .toast {
            background: #1f1f1f; color: white; padding: 16px 24px;
            border-left: 4px solid var(--accent); box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            animation: toast-in 0.3s var(--win10-curve); pointer-events: auto;
            min-width: 280px; font-size: 14px; opacity: 1; transition: opacity 0.3s;
        }
        @keyframes toast-in { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Windows 8/10 Progress Ring */
        .win8-loader { position: relative; width: 40px; height: 40px; margin-top: 30px; display: none; }
        .win8-loader .dot { position: absolute; width: 40px; height: 40px; opacity: 0; transform: rotate(225deg); animation: win8-orbit 5.5s infinite; }
        .win8-loader .dot:after { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 5px; background: #fff; }
        .win8-loader .dot:nth-child(2) { animation-delay: 240ms; }
        .win8-loader .dot:nth-child(3) { animation-delay: 480ms; }
        .win8-loader .dot:nth-child(4) { animation-delay: 720ms; }
        .win8-loader .dot:nth-child(5) { animation-delay: 960ms; }
        @keyframes win8-orbit {
            0% { transform: rotate(225deg); opacity: 1; animation-timing-function: ease-out; }
            7% { transform: rotate(345deg); animation-timing-function: linear; }
            30% { transform: rotate(455deg); animation-timing-function: ease-in-out; }
            39% { transform: rotate(690deg); animation-timing-function: linear; }
            70% { transform: rotate(815deg); opacity: 1; animation-timing-function: ease-out; }
            75% { transform: rotate(945deg); animation-timing-function: ease-out; }
            76% { transform: rotate(945deg); opacity: 0; }
            100% { transform: rotate(945deg); opacity: 0; }
        }

        /* Overlay Styles */
        #setup-overlay, #wallpaper-overlay, #data-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(40px);
            z-index: 9000; display: none; flex-direction: column;
            align-items: center; justify-content: center;
        }
        #setup-overlay.active, #wallpaper-overlay.active, #data-overlay.active { display: flex; animation: win10-fade-in 0.3s; }
        
        .setup-card { 
            max-width: 500px; width: 90%; padding: 30px; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            display: flex; flex-direction: column; max-height: 80vh;
        }
        .setup-input-group { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .setup-input {
            width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            color: white; outline: none; font-size: 14px;
        }
        .setup-input:focus { border-color: var(--accent); }
        .btn-add { background: var(--accent); color: white; border: none; padding: 12px 20px; cursor: pointer; font-weight: 600; width: 100%; }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-collapsed-width); background: var(--sidebar-bg-collapsed);
            backdrop-filter: blur(25px); display: flex; flex-direction: column;
            position: fixed; top: 0; left: 0; bottom: 0; z-index: 1000;
            transition: width 0.3s var(--win10-curve); overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar.expanded { width: var(--sidebar-expanded-width); background: var(--sidebar-bg-expanded); }

        .nav-item {
            position: relative; height: 48px; display: flex; align-items: center;
            cursor: pointer; width: 100%; transition: background 0.1s;
            overflow: hidden;
        }
        .nav-item:hover { background: rgba(255,255,255,0.08); }
        .nav-item.active::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; background: var(--accent); z-index: 5; }
        
        .nav-icon { 
            width: 48px; min-width: 48px; height: 48px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 18px; flex-shrink: 0;
        }
        .nav-icon img { width: 20px; height: 20px; object-fit: contain; }
        
        .nav-label { 
            white-space: nowrap; font-size: 14px; opacity: 0; 
            transform: translateX(-15px); transition: 0.3s; 
            flex: 1; overflow: hidden; text-overflow: ellipsis; padding-right: 10px;
        }
        .sidebar.expanded .nav-label { opacity: 1; transform: translateX(0); }

        .sidebar-section-title {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            padding: 0; opacity: 0; transition: all 0.2s var(--win10-curve);
            white-space: nowrap; pointer-events: none; color: rgba(255,255,255,0.5);
            height: 0; overflow: hidden;
        }
        .sidebar.expanded .sidebar-section-title { 
            opacity: 1; height: 48px; padding: 20px 14px 10px; display: flex; align-items: center;
        }

        /* Confirm Dialog */
        #confirm-dialog {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 10000;
            display: none; align-items: center; justify-content: center;
        }
        #confirm-dialog.active { display: flex; }
        .dialog-box { background: #1f1f1f; width: 380px; padding: 30px; border: 1px solid rgba(255,255,255,0.15); }
        .dialog-buttons { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }
        .btn-dialog { padding: 10px 24px; border: none; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #0078d4; color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }

        /* View Container */
        .view-container { 
            flex: 1; padding: 60px 5vw; margin-left: var(--sidebar-collapsed-width); 
            transition: 0.3s var(--win10-curve); min-height: 100vh; 
        }

        /* Content Animation */
        .animate-view { animation: win10-view-entrance 0.5s var(--win10-entrance) forwards; }

        /* Tile Grid */
        .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile-size), 1fr)); grid-auto-rows: var(--tile-size); grid-auto-flow: dense; gap: var(--tile-gap); margin-top: 30px; }
        
        .tile { 
            position: relative; padding: 15px; display: flex; flex-direction: column; justify-content: flex-end; 
            background: var(--accent); transition: transform 0.2s; overflow: hidden; 
            cursor: pointer; background-size: cover; background-position: center; border: none; 
        }
        .tile:hover { transform: scale(1.02); }
        .tile.wide { grid-column: span 2; }
        .tile.large { grid-column: span 2; grid-row: span 2; }
        .tile-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%); z-index: 1; }
        .tile-content { position: relative; z-index: 2; }
        .tile-title { font-size: 14px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .tile.normal-agg {
            background-color: rgba(255, 255, 255, 0.05) !important;
            border: none;
            backdrop-filter: blur(5px);
        }
        .tile.normal-agg:hover { background-color: rgba(255, 255, 255, 0.12) !important; }

        .tile-agg-icon { font-size: 40px; margin-bottom: 10px; opacity: 0.9; }
        .tile-agg-icon img { width: 48px; height: 48px; object-fit: contain; }

        /* Reader Overlay */
        .reader-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 7000; background: var(--reader-bg); display: none; flex-direction: column; overflow-y: auto; transition: background 0.3s ease; }
        .reader-overlay.active { display: flex; animation: win10-slide-up 0.4s var(--win10-curve) forwards; }
        .reader-overlay.closing { animation: win10-scale-down 0.25s var(--win10-curve) forwards; }
        .reader-header { padding: 10px 40px; position: sticky; top: 0; background: rgba(20,20,20,0.9); backdrop-filter: blur(30px); z-index: 10; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); height: 64px; }
        .back-circle { width: 44px; height: 44px; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .back-circle:hover { background: white; color: black; transform: scale(1.1); }
        .reader-body { max-width: 760px; width: 90%; margin: 60px auto; color: var(--reader-text); font-size: var(--reader-font-size); line-height: 1.7; transition: color 0.3s; }
        .reader-body h1 { margin-bottom: 20px; color: var(--reader-title-color); font-weight: 300; font-size: 38px; }
        .reader-body img { max-width: 100%; height: auto; margin: 30px 0; border-radius: 2px; }

        /* Reader Settings */
        .reader-settings-flyout { 
            position: fixed; top: 72px; right: 40px; width: 320px; 
            background: #2b2b2b; border: 1px solid rgba(255,255,255,0.15); 
            box-shadow: 0 12px 40px rgba(0,0,0,0.6); z-index: 8000; padding: 24px; 
            display: none; flex-direction: column; color: white; 
            transform-origin: top right; 
        }
        .reader-settings-flyout.active { display: flex; animation: win10-flyout-entrance 0.35s var(--win10-curve) forwards; }
        .reader-settings-flyout.closing { animation: win10-flyout-exit 0.25s var(--win10-curve) forwards; }
        
        .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .theme-option { height: 48px; border: 2px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: 0.2s; }
        .theme-option.active { border-color: var(--accent); background: rgba(0,120,215,0.1); }
        .theme-dark { background: #111; color: #ccc; }
        .theme-light { background: #fff; color: #333; }
        .theme-sepia { background: #f4ecd8; color: #5b4636; }

        /* Search Panel */
        .win8-charms-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 8000; display: none; backdrop-filter: blur(5px); }
        .win8-charms-mask.active { display: block; }
        .win8-search-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; background: rgba(20, 20, 20, 0.95); z-index: 8001; transform: translateX(100%); transition: 0.4s var(--win10-curve); padding: 60px 40px; color: white; backdrop-filter: blur(20px); border-left: 1px solid rgba(255,255,255,0.1); }
        .win8-search-panel.active { transform: translateX(0); }
        .search-bar { background: rgba(255, 255, 255, 0.1); display: flex; align-items: center; padding: 12px; border: 2px solid rgba(255, 255, 255, 0.3); margin-bottom: 20px; }
        .search-bar:focus-within { border-color: var(--accent); }
        .search-bar input { flex: 1; border: none; background: transparent; outline: none; color: white; font-size: 16px; }

        /* Mini Loader for Search */
        #search-loader { margin-top: 10px; transform: scale(0.6); transform-origin: left; }

        /* Animations */
        @keyframes win10-view-entrance {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes win10-flyout-entrance { 
            from { opacity: 0; transform: translateY(-20px) scale(0.92); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        @keyframes win10-flyout-exit { 
            from { opacity: 1; transform: translateY(0) scale(1); } 
            to { opacity: 0; transform: translateY(-15px) scale(0.95); } 
        }
        @keyframes win10-slide-up { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes win10-scale-down { from { transform: scale(1); opacity: 1; } to { transform: scale(0.96); opacity: 0; } }
        @keyframes win10-fade-in { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="locked">

    <div id="toast-container"></div>

    <!-- Confirm Dialog -->
    <div id="confirm-dialog">
        <div class="dialog-box">
            <h2 style="font-weight: 300; margin-bottom: 10px;">确认删除</h2>
            <p style="opacity: 0.7; font-size: 14px;">确定要从订阅列表中移除该源吗？</p>
            <div class="dialog-buttons">
                <button class="btn-dialog btn-primary" id="confirm-delete-btn">删除</button>
                <button class="btn-dialog btn-secondary" onclick="hideConfirmDialog()">取消</button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="nav-item" onclick="toggleSidebar()">
            <div class="nav-icon"><span class="iconify" data-icon="fluent:line-horizontal-3-24-regular"></span></div>
            <div class="nav-label" style="font-weight: 600;">菜单</div>
        </div>
        
        <div class="nav-list" style="flex:1; overflow-y: auto; overflow-x: hidden;">
            <div class="nav-item active" id="nav-home" onclick="showHomeView()">
                <div class="nav-icon"><span class="iconify" data-icon="fluent:home-24-regular"></span></div>
                <div class="nav-label">主页</div>
            </div>
            <div class="nav-item" onclick="toggleSearch(true)">
                <div class="nav-icon"><span class="iconify" data-icon="fluent:search-24-regular"></span></div>
                <div class="nav-label">搜索</div>
            </div>

            <div class="sidebar-section-title">订阅源</div>
            <div id="sidebar-feeds-list"></div>
        </div>

        <div class="sidebar-footer">
            <div class="nav-item" onclick="openDataOverlay()">
                <div class="nav-icon"><span class="iconify" data-icon="fluent:arrow-download-24-regular"></span></div>
                <div class="nav-label">数据管理</div>
            </div>
            <div class="nav-item" onclick="openWallpaperSettings()">
                <div class="nav-icon"><span class="iconify" data-icon="fluent:image-24-regular"></span></div>
                <div class="nav-label">更换壁纸</div>
            </div>
            <div class="nav-item" onclick="openSettings()">
                <div class="nav-icon"><span class="iconify" data-icon="fluent:add-circle-24-regular"></span></div>
                <div class="nav-label">管理订阅</div>
            </div>
        </div>
    </aside>

    <!-- Data Management Overlay -->
    <div id="data-overlay" style="display:none;">
        <div class="setup-card">
            <h1 style="font-weight: 200; font-size: 32px;">数据管理</h1>
            <p style="font-size: 13px; opacity: 0.7; margin-top: 10px;">您可以备份当前的所有订阅源和个性化设置，或从备份文件中恢复。</p>
            <div class="setup-input-group">
                <button onclick="exportUserData()" class="btn-add" style="margin-bottom: 5px; background: #107c10;">导出备份 (.json)</button>
                <button onclick="document.getElementById('import-file-input').click()" class="btn-add" style="background: var(--accent);">导入备份文件</button>
                <input type="file" id="import-file-input" style="display:none" accept=".json" onchange="importUserData(event)">
            </div>
            <div style="text-align: right; margin-top: 10px;">
                <button onclick="closeDataOverlay()" style="background: none; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 30px; cursor: pointer;">取消</button>
            </div>
        </div>
    </div>

    <!-- Wallpaper Settings Overlay -->
    <div id="wallpaper-overlay" style="display:none;">
        <div class="setup-card">
            <h1 style="font-weight: 200; font-size: 32px;">个性化壁纸</h1>
            <p style="font-size: 13px; opacity: 0.7; margin-top: 10px;">输入图片 URL 地址来更新网页背景</p>
            <div class="setup-input-group">
                <input type="text" id="wallpaper-input" class="setup-input" placeholder="https://example.com/image.jpg">
                <button onclick="applyWallpaper()" class="btn-add">更新背景</button>
                <button onclick="resetWallpaper()" style="background: rgba(255,255,255,0.05); color: white; border: none; padding: 10px; cursor: pointer; font-size: 12px; margin-top: 5px;">恢复默认</button>
            </div>
            <div style="text-align: right; margin-top: 10px;">
                <button onclick="closeWallpaperSettings()" style="background: none; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 30px; cursor: pointer;">关闭</button>
            </div>
        </div>
    </div>

    <!-- Feed Setup Overlay -->
    <div id="setup-overlay">
        <div class="setup-card">
            <h1 style="font-weight: 200; font-size: 32px;">管理订阅</h1>
            <div class="setup-input-group">
                <input type="text" id="rss-input" class="setup-input" placeholder="输入 RSS 链接 (必填)">
                <input type="text" id="icon-input" class="setup-input" placeholder="图标链接 (可选，留空则自动获取)">
                <button onclick="addNewFeed()" class="btn-add">添加订阅</button>
            </div>
            <div id="settings-feeds-list" style="max-height: 200px; overflow-y: auto; margin: 10px 0;"></div>
            <div style="text-align: right; margin-top: 20px;">
                <button onclick="closeSettings()" style="background: var(--accent); color: white; border: none; padding: 10px 30px; cursor: pointer;">完成</button>
            </div>
        </div>
    </div>

    <!-- Reader -->
    <div id="reader" class="reader-overlay">
        <div class="reader-header">
            <div style="display: flex; align-items: center; gap: 24px;">
                <div class="back-circle" onclick="closeReader()"><span class="iconify" data-icon="fluent:arrow-left-24-regular"></span></div>
                <div id="reader-title-min" style="font-size: 14px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 400px;"></div>
            </div>
            <div style="display: flex; gap: 5px;">
                <button onclick="copyArticleLink()" style="background:none; border:none; color:white; cursor:pointer; padding:10px;"><span class="iconify" data-icon="fluent:share-24-regular" style="font-size: 20px;"></span></button>
                <button id="reader-settings-btn" onclick="toggleReaderSettings(event)" style="background:none; border:none; color:white; cursor:pointer; padding:10px;"><span class="iconify" data-icon="fluent:settings-24-regular" style="font-size: 20px;"></span></button>
            </div>
        </div>

        <!-- Reader Settings Flyout -->
        <div id="reader-settings" class="reader-settings-flyout">
            <div style="font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 15px; opacity: 0.5;">阅读设置</div>
            <div style="margin-bottom: 20px;">
                <div style="font-size: 14px; margin-bottom: 10px;">背景主题</div>
                <div class="theme-grid">
                    <div class="theme-option theme-dark active" onclick="setReaderTheme('dark')">默认</div>
                    <div class="theme-option theme-light" onclick="setReaderTheme('light')">明亮</div>
                    <div class="theme-option theme-sepia" onclick="setReaderTheme('sepia')">护眼</div>
                </div>
            </div>
            <div>
                <div style="font-size: 14px; margin-bottom: 10px; display: flex; justify-content: space-between;">
                    <span>字体大小</span>
                    <span id="font-size-label">18px</span>
                </div>
                <input type="range" min="12" max="32" value="18" style="width: 100%; accent-color: var(--accent);" oninput="updateFontSize(this.value)">
            </div>
        </div>

        <div class="reader-body">
            <div id="reader-date" style="font-size: 14px; opacity: 0.5; margin-bottom: 10px;"></div>
            <h1 id="reader-full-title"></h1>
            <div id="reader-content"></div>
        </div>
    </div>

    <!-- Search Panel -->
    <div class="win8-charms-mask" id="search-mask" onclick="toggleSearch(false)"></div>
    <div class="win8-search-panel" id="search-panel">
        <h2 style="font-weight: 200; font-size: 42px; margin-bottom: 30px;">搜索</h2>
        <div class="search-bar">
            <input type="text" placeholder="查找文章... (Ctrl+F)" id="global-search-input">
            <span class="iconify" data-icon="fluent:search-24-regular"></span>
        </div>
        <div id="search-loader" class="win8-loader">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <p id="search-status" style="font-size: 12px; opacity: 0.5; margin-top: 10px;">输入关键字立即开始全局检索</p>
        <button onclick="toggleSearch(false)" style="margin-top: 20px; padding: 10px 20px; background: var(--accent); color: white; border: none; cursor: pointer;">返回</button>
    </div>

    <div class="view-container" id="content-view">
        <header id="view-header">
            <h1 id="view-title" style="font-size: 56px; font-weight: 200;">欢迎回来</h1>
            <p id="view-desc" style="font-size: 18px; opacity: 0.7; margin-top: 10px;">请选择一个订阅源开始阅读</p>
            <div id="sync-loader" class="win8-loader">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </header>
        <div class="tile-grid" id="main-grid"></div>
    </div>

    <script>
        let feeds = [];
        let currentFeedUrl = ''; 
        let pendingDeleteUrl = null;
        let activeArticle = null;
        
        // 可用索引系统
        let articleIndex = []; 
        let searchDebounce = null;

        const themes = {
            dark: { bg: '#111111', text: '#cccccc', title: '#ffffff' },
            light: { bg: '#ffffff', text: '#333333', title: '#000000' },
            sepia: { bg: '#f4ecd8', text: '#5b4636', title: '#3d2b1f' }
        };

        window.onload = () => {
            const saved = localStorage.getItem('uwp_rss_v6');
            if (saved) {
                feeds = JSON.parse(saved);
            } else {
                feeds = [{ 
                    url: "https://sspai.com/feed", 
                    title: "少数派", 
                    icon: "https://www.google.com/s2/favicons?domain=sspai.com&sz=64" 
                }];
                saveFeeds();
            }
            
            const savedWallpaper = localStorage.getItem('uwp_wallpaper');
            if (savedWallpaper) {
                document.body.style.backgroundImage = `url('${savedWallpaper}')`;
                document.getElementById('wallpaper-input').value = savedWallpaper;
            }

            updateFontSize(localStorage.getItem('reader_font_size') || '18');
            setReaderTheme(localStorage.getItem('reader_theme') || 'dark');

            renderSidebarFeeds();
            showHomeView(); 

            document.getElementById('confirm-delete-btn').onclick = executeRemoveFeed;
            
            // 绑定全局搜索事件
            const searchInput = document.getElementById('global-search-input');
            searchInput.addEventListener('input', handleSearchInput);

            // 接管浏览器 Ctrl+F
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault();
                    toggleSearch(true);
                }
            });

            window.addEventListener('click', (e) => {
                const flyout = document.getElementById('reader-settings');
                const btn = document.getElementById('reader-settings-btn');
                if (flyout.classList.contains('active') && !flyout.contains(e.target) && !btn.contains(e.target)) {
                    hideReaderSettings();
                }
            });

            // 初始索引
            buildGlobalIndex();
        };

        function saveFeeds() {
            localStorage.setItem('uwp_rss_v6', JSON.stringify(feeds));
            buildGlobalIndex(); // 更新源后重新索引
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('expanded');
        }

        function toggleSearch(show) {
            const panel = document.getElementById('search-panel');
            panel.classList.toggle('active', show);
            document.getElementById('search-mask').classList.toggle('active', show);
            if(show) {
                setTimeout(() => document.getElementById('global-search-input').focus(), 300);
            }
        }

        // --- 核心搜索与索引逻辑 ---
        async function buildGlobalIndex() {
            articleIndex = [];
            // 对每个 Feed 进行轻量级预抓取以建立全局索引（限制前3个主要源以保证性能）
            const tasks = feeds.slice(0, 5).map(async feed => {
                try {
                    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`);
                    const data = await res.json();
                    if(data.status === 'ok') {
                        data.items.forEach(item => {
                            articleIndex.push({
                                ...item,
                                feedTitle: data.feed.title
                            });
                        });
                    }
                } catch(e) {}
            });
            await Promise.all(tasks);
        }

        function handleSearchInput(e) {
            const query = e.target.value.trim().toLowerCase();
            const loader = document.getElementById('search-loader');
            const status = document.getElementById('search-status');

            if (searchDebounce) clearTimeout(searchDebounce);

            if (!query) {
                loader.style.display = 'none';
                status.innerText = "输入关键字立即开始全局检索";
                return;
            }

            loader.style.display = 'block'; // 显示 Windows 8 动画
            status.innerText = "正在检索索引库...";

            searchDebounce = setTimeout(() => {
                const results = articleIndex.filter(item => 
                    item.title.toLowerCase().includes(query) || 
                    (item.description && item.description.toLowerCase().includes(query))
                );

                displaySearchResults(results, query);
                loader.style.display = 'none';
                status.innerText = `找到 ${results.length} 个匹配项`;
            }, 800); // 模拟索引检索延迟以展示动画
        }

        function displaySearchResults(results, query) {
            currentFeedUrl = 'search_results'; // 临时状态
            renderSidebarFeeds();

            document.getElementById('view-title').innerText = `搜索: ${query}`;
            document.getElementById('view-desc').innerText = `为您找到 ${results.length} 篇相关内容`;
            
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            
            if (results.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; padding: 40px; text-align: center; opacity: 0.5;">没有找到匹配的文章，请尝试其他关键词。</div>`;
                return;
            }

            renderTiles(results);
            triggerViewAnimation();
        }

        // --- Data & Wallpaper Logic ---
        function openDataOverlay() {
            const overlay = document.getElementById('data-overlay');
            overlay.style.display = 'flex';
            overlay.classList.add('active');
            document.body.classList.add('locked');
        }

        function closeDataOverlay() {
            const overlay = document.getElementById('data-overlay');
            overlay.style.display = 'none';
            overlay.classList.remove('active');
            document.body.classList.remove('locked');
        }

        function exportUserData() {
            const backup = {
                feeds: feeds,
                wallpaper: localStorage.getItem('uwp_wallpaper'),
                version: 'uwp_rss_v6_backup'
            };
            const dataStr = JSON.stringify(backup, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `rss_reader_backup_${new Date().toLocaleDateString()}.json`;
            link.click();
            URL.revokeObjectURL(url);
            showToast("配置已导出");
        }

        function importUserData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.feeds && Array.isArray(data.feeds)) {
                        feeds = data.feeds;
                        saveFeeds();
                        if (data.wallpaper) {
                            localStorage.setItem('uwp_wallpaper', data.wallpaper);
                            document.body.style.backgroundImage = `url('${data.wallpaper}')`;
                        }
                        renderSidebarFeeds();
                        showHomeView();
                        showToast("备份恢复成功");
                        closeDataOverlay();
                    }
                } catch (err) {
                    showToast("导入失败");
                }
            };
            reader.readAsText(file);
        }

        function openWallpaperSettings() {
            const overlay = document.getElementById('wallpaper-overlay');
            overlay.style.display = 'flex';
            overlay.classList.add('active'); 
            document.body.classList.add('locked');
        }

        function closeWallpaperSettings() {
            const overlay = document.getElementById('wallpaper-overlay');
            overlay.style.display = 'none';
            overlay.classList.remove('active');
            document.body.classList.remove('locked');
        }

        function applyWallpaper() {
            const url = document.getElementById('wallpaper-input').value.trim();
            if (url) {
                document.body.style.backgroundImage = `url('${url}')`;
                localStorage.setItem('uwp_wallpaper', url);
                showToast("壁纸已更新");
                closeWallpaperSettings();
            }
        }

        function resetWallpaper() {
            document.body.style.backgroundImage = `radial-gradient(circle at 90% 10%, rgba(255,255,255,0.08) 0%, transparent 40%),
                              linear-gradient(135deg, #005a9e 0%, #001832 100%)`;
            document.getElementById('wallpaper-input').value = '';
            localStorage.removeItem('uwp_wallpaper');
            showToast("已恢复默认壁纸");
        }

        function openSettings() {
            document.getElementById('setup-overlay').classList.add('active');
            document.body.classList.add('locked');
        }

        function closeSettings() {
            if (feeds.length > 0) {
                document.getElementById('setup-overlay').classList.remove('active');
                document.body.classList.remove('locked');
            }
        }

        async function addNewFeed() {
            const input = document.getElementById('rss-input');
            const iconInput = document.getElementById('icon-input');
            const url = input.value.trim();
            const customIcon = iconInput.value.trim();

            if (!url) return;
            showToast("正在获取订阅信息...");
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
            
            try {
                const res = await fetch(apiUrl);
                const data = await res.json();
                if (data.status === 'ok') {
                    const domain = new URL(url).hostname;
                    const finalIcon = customIcon || `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
                    feeds.unshift({
                        url: url,
                        title: data.feed.title || domain,
                        icon: finalIcon
                    });
                    saveFeeds();
                    renderSidebarFeeds();
                    input.value = '';
                    iconInput.value = ''; 
                    showToast("添加成功");
                }
            } catch (err) {
                showToast("无法获取源信息");
            }
        }

        function triggerViewAnimation() {
            const grid = document.getElementById('main-grid');
            const header = document.getElementById('view-header');
            grid.classList.remove('animate-view');
            header.classList.remove('animate-view');
            void grid.offsetWidth;
            void header.offsetWidth;
            grid.classList.add('animate-view');
            header.classList.add('animate-view');
        }

        function showHomeView() {
            currentFeedUrl = ''; 
            renderSidebarFeeds(); 
            document.getElementById('view-title').innerText = "欢迎回来";
            document.getElementById('view-desc').innerText = "你的订阅聚合";
            
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            
            feeds.forEach((feed) => {
                const tile = document.createElement('div');
                tile.className = 'tile normal tile-acrylic normal-agg';
                tile.innerHTML = `
                    <div class="tile-overlay"></div>
                    <div class="tile-content">
                        <div class="tile-agg-icon"><img src="${feed.icon}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxZW0iIGhlaWdodD0iMWVtIiB2aWV3Qm94PSIwIDAgMjQgMjQiPjxwYXRoIGZpbGw9IndoaXRlIiBkPSJNMTIgMmM1LjUyIDAgMTAgNC40OCAxMCAxMHMtNC40OCAxMC0xMCAxMFMyIDE3LjUyIDIgMTIgNi40OCAyIDEyIDJtMCAyYTYuOTcgNi45NyAwIDAgMC01Ljg3IDMuNWg0Ljg3QTE2LjA1IDE2LjA1IDAgMCAxIDExIDQuMDNhOC40IDguNCAwIDAgMC0xIDBtMyAxLjU3YTE0IDE0IDAgMCAxIDEuNzIgNi40M3gyLjY1QTguMDEgOC4wMSAwIDAgMCAxNCA1LjU3bS04IDBBNy45OSA3Ljk5IDAgMCAwIDUuNjMgMTJoMi42NUExNCAxNCAwIDAgMSAxMCA1LjU3bm0yLTEuNTRhOC40IDguNCAwIDAgMC0xID1hMTYuMDUgMTYuMDUgMCAwIDEgLTAuMTMtNy40Nk0xMiA0Yy40MiAwIC44My4wMSAxLjIzLjA0QTE2LjA1IDE2LjA1IDAgMCAxIDEyIDRtMyAxLjU3YTE0IDE0IDAgMCAxIDEuNzIgNi40M3gyLjY1QTguMDEgOC4wMSAwIDAgMCAxNCA1LjU3bS04IDBBNy45OSA3Ljk5IDAgMCAwIDUuNjMgMTJoMi42NUExNCAxNCAwIDAgMSAxMCA1LjU3bS04IDkuNDNoMi42NUE4LjA0IDguMDQgMCAwIDAgNiA0LjU3YTE0IDE0IDAgMCAxIDEuNzIgNi40M3oiLz48L3N2Zz4='"></div>
                        <div class="tile-title" style="font-weight: 600; text-align: center;">${feed.title}</div>
                    </div>
                `;
                tile.onclick = () => selectFeed(feed.url);
                grid.appendChild(tile);
            });
            triggerViewAnimation();
            document.body.classList.remove('locked');
        }

        async function selectFeed(url) {
            if (currentFeedUrl === url) return;
            currentFeedUrl = url;
            renderSidebarFeeds();
            
            const loader = document.getElementById('sync-loader');
            const grid = document.getElementById('main-grid');
            loader.style.display = 'block';
            grid.innerHTML = '';
            
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
            try {
                const res = await fetch(apiUrl);
                const data = await res.json();
                if (data.status === 'ok') {
                    document.getElementById('view-title').innerText = data.feed.title;
                    document.getElementById('view-desc').innerText = data.feed.description || url;
                    renderTiles(data.items);
                    triggerViewAnimation();
                }
            } catch (err) {
                showToast("同步失败");
            } finally {
                loader.style.display = 'none';
            }
        }

        function renderSidebarFeeds() {
            const container = document.getElementById('sidebar-feeds-list');
            container.innerHTML = '';
            const homeNav = document.getElementById('nav-home');
            homeNav.classList.toggle('active', currentFeedUrl === '');

            feeds.forEach(feed => {
                const item = document.createElement('div');
                item.className = `nav-item ${feed.url === currentFeedUrl ? 'active' : ''}`;
                item.onclick = () => selectFeed(feed.url);
                item.oncontextmenu = (e) => {
                    e.preventDefault();
                    pendingDeleteUrl = feed.url;
                    document.getElementById('confirm-dialog').classList.add('active');
                };
                item.innerHTML = `
                    <div class="nav-icon"><img src="${feed.icon}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="nav-icon-placeholder" style="display:none;"><span class="iconify" data-icon="fluent:globe-24-regular"></span></div></div>
                    <div class="nav-label">${feed.title}</div>
                `;
                container.appendChild(item);
            });
        }

        function renderTiles(items) {
            const grid = document.getElementById('main-grid');
            const accentColors = ['#0078d7', '#107c10', '#8764b8', '#00b7c3', '#e81123'];
            items.forEach((item, i) => {
                let size = 'normal';
                if (i === 0) size = 'large';
                else if (i % 6 === 0) size = 'wide';
                const tile = document.createElement('div');
                tile.className = `tile ${size}`;
                tile.style.backgroundColor = accentColors[i % accentColors.length];
                const cover = extractCover(item);
                if (cover) tile.style.backgroundImage = `url('${cover}')`;
                tile.innerHTML = `<div class="tile-overlay"></div><div class="tile-content"><div class="tile-title">${item.title}</div></div>`;
                tile.onclick = () => openReader(item);
                grid.appendChild(tile);
            });
        }

        function extractCover(item) {
            if (item.thumbnail && item.thumbnail.includes('http')) return item.thumbnail;
            const content = item.content || item.description || "";
            const match = content.match(/<img[^>]+src="([^">]+)"/);
            return match ? match[1] : null;
        }

        function executeRemoveFeed() {
            if (!pendingDeleteUrl) return;
            feeds = feeds.filter(f => f.url !== pendingDeleteUrl);
            saveFeeds();
            renderSidebarFeeds();
            showHomeView();
            hideConfirmDialog();
        }

        function hideConfirmDialog() {
            document.getElementById('confirm-dialog').classList.remove('active');
            pendingDeleteUrl = null;
        }

        function toggleReaderSettings(e) {
            e.stopPropagation();
            const flyout = document.getElementById('reader-settings');
            flyout.classList.contains('active') ? hideReaderSettings() : showReaderSettings();
        }

        function showReaderSettings() {
            const flyout = document.getElementById('reader-settings');
            flyout.classList.remove('closing');
            flyout.classList.add('active');
        }

        function hideReaderSettings() {
            const flyout = document.getElementById('reader-settings');
            if (!flyout.classList.contains('active')) return;
            flyout.classList.add('closing');
            setTimeout(() => {
                flyout.classList.remove('active', 'closing');
            }, 250); 
        }

        function setReaderTheme(themeName) {
            const theme = themes[themeName] || themes.dark;
            const root = document.documentElement;
            root.style.setProperty('--reader-bg', theme.bg);
            root.style.setProperty('--reader-text', theme.text);
            root.style.setProperty('--reader-title-color', theme.title);
            localStorage.setItem('reader_theme', themeName);
        }

        function updateFontSize(val) {
            document.documentElement.style.setProperty('--reader-font-size', val + 'px');
            document.getElementById('font-size-label').innerText = val + 'px';
            localStorage.setItem('reader_font_size', val);
        }

        function openReader(item) {
            activeArticle = item;
            const reader = document.getElementById('reader');
            document.getElementById('reader-title-min').innerText = item.title;
            document.getElementById('reader-full-title').innerText = item.title;
            document.getElementById('reader-date').innerText = item.pubDate;
            document.getElementById('reader-content').innerHTML = item.content || item.description;
            reader.classList.add('active');
            document.body.classList.add('locked');
            reader.scrollTop = 0;
        }

        function closeReader() {
            const reader = document.getElementById('reader');
            reader.classList.add('closing');
            setTimeout(() => {
                reader.classList.remove('active', 'closing');
                document.body.classList.remove('locked');
            }, 250);
        }

        function copyArticleLink() {
            if (activeArticle && activeArticle.link) {
                const el = document.createElement('textarea');
                el.value = activeArticle.link;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                showToast("链接已复制");
            }
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
